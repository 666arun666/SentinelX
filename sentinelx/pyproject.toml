[project]
name = "sentinelx"
version = "0.1.0"
description = "AI-powered Linux Security Operations Center (SOC) monitoring and investigation platform"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.58.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
ai = [
    "langgraph>=0.1.5",
    "langchain-core>=0.2.5",
    "langsmith>=0.1.60",
    "anthropic>=0.28.0",
    "qdrant-client>=1.9.1",
]
reports = [
    "reportlab>=4.2.0",
    "jinja2>=3.1.4",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "black>=24.4.2",
    "mypy>=1.10.0",
    "types-redis",
]

[project.scripts]
sentinelx = "sentinelx.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinelx*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
