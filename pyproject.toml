[project]
name = "sentinelx"
version = "0.1.0"
description = "Terminal-first Linux security monitoring daemon with AI-powered investigation"
authors = [{name = "Antigravity", email = "antigravity@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "textual>=0.47.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.1",
    "qdrant-client>=1.7.1",
    "pyyaml>=6.0.3",
    "langgraph>=1.2.11",
    "anthropic>=0.20.0",
    "openai>=1.0.0",
]

[project.scripts]
sentinelx = "sentinelx.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
    "mypy>=1.8.0",
    "mkdocs>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true
